<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>OpenJarvis</title>

  <!-- CSS File -->
  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="logo">
        OpenJarvis
      </div>

      <button class="new-chat-btn">
        + New Chat
      </button>

      <div class="history">

        <div class="history-item">
          AI Assistant
        </div>

        <div class="history-item">
          Python Help
        </div>

        <div class="history-item">
          Data Analysis
        </div>

      </div>

    </aside>

    <!-- Main Chat -->
    <main class="chat-container">

      <!-- Header -->
      <div class="chat-header">
        OpenJarvis AI
      </div>

      <!-- Messages -->
      <div class="messages">

        <div class="message assistant">
          <div class="message-content">
            Hello 👋 I am OpenJarvis.
            How can I help you today?
          </div>
        </div>

        <div class="message user">
          <div class="message-content">
            Create a ChatGPT interface
          </div>
        </div>

        <div class="message assistant">
          <div class="message-content">
            Sure! I can help you build a modern AI interface.
          </div>
        </div>

      </div>

      <!-- Input Area -->
      <div class="input-area">

        <input
          type="text"
          placeholder="Send a message..."
        />

        <button>
          Send
        </button>

      </div>

    </main>

  </div>

</body>

</html>
